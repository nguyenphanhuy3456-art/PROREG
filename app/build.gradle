plugins { id 'com.android.application' }
android {
    namespace 'com.modssensi'
    compileSdk 34
    defaultConfig {
        applicationId "com.modssensi"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "2.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
